<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理人室</title>
  <link rel="stylesheet" href="./diary.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>★ 管理人室 ★</h1>
      <p>日記執筆所</p>
    </header>
    <table class="layout">
      <tr>
        <td class="side">
          <div class="box">
            <p class="box-title">MENU</p>
            <ul class="nav">
              <li><a href="../">TOP PAGE</a></li>
              <li><a href="./">DIARY</a></li>
              <li><a href="./bbs.html">BBS / 掲示板</a></li>
              <li><a href="./station.html">管理人室</a></li>
            </ul>
          </div>
          <div class="box">公開 Buttonの後<br>GitHubの中内容確認<br>Submit願。</div>
        </td>
        <td class="main">
          <p class="content-title">■ 新日記執筆</p>
          <div class="entry">
            <p class="note">公開後 GitHubの新 Issue画面表示。写真、当画面の内 Drag追加願。</p>
            <form id="post-form">
              <div class="form-row"><label for="post-date">日付</label><input id="post-date" name="date" type="date" required></div>
              <div class="form-row"><label for="post-title">標題</label><input id="post-title" name="title" type="text" maxlength="80" required></div>
              <div class="form-row"><label for="post-author">投稿者名</label><input id="post-author" name="author" type="text" maxlength="40" value="Yuri"></div>
              <div class="form-row"><label for="post-body">本文</label><textarea id="post-body" name="body" maxlength="5000" required></textarea></div>
              <button type="submit">GitHubの中公開</button>
            </form>
          </div>
          <p class="pager"><a href="./">← 日記一覧復帰</a></p>
        </td>
      </tr>
    </table>
    <footer class="footer"><a href="../">TOP復帰</a></footer>
  </div>
  <script src="./github-config.js"></script>
  <script src="./github-data.js"></script>
</body>
</html>
